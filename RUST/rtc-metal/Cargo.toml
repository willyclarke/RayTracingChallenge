[package]
name = "rtc-metal"
version = "0.1.0"
edition = "2024"

[dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-foundation",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-metal-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTKView",
    "objc2-app-kit",
    "objc2-core-foundation",
    "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CAMetalLayer",
    "objc2-metal",
] }
rtc-rust = { version = "0.1.0", path = "../rtc-rust" }
rtc-share = { path = "../rtc-share" }
