[package]
name = "rtc-edit"
version = "0.1.0"
edition = "2024"

[dependencies]
rtc-rust = { version = "0.1.0", path = "../rtc-rust" }
serde_json = "1"
iced = "0.14"
rtc-share = { path = "../rtc-share" }
rfd = "0.15"
# GCD: the proc source that says the viewer ended.
dispatch2 = "0.3"
block2 = "0.6"
# The native menu bar.
muda = "0.21"
# The Dock icon.
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSResponder",
] }
