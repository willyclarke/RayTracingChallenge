[package]
name = "rtc-edit"
version = "0.1.0"
edition = "2024"

[dependencies]
rtc-rust = { version = "0.1.0", path = "../rtc-rust" }
serde_json = "1"
# tokio: for iced::time::every, the timer that reads the viewer's camera.
iced = { version = "0.14", features = ["tokio"] }
rtc-share = { path = "../rtc-share" }
rfd = "0.15"
# GCD: the proc source that says the viewer ended.
dispatch2 = "0.3"
block2 = "0.6"
# The native menu bar.
muda = "0.21"
